<script id="fs" type="x-shader">#version 300 es

// material: 0 floor, 1 plate, 2 sleeve, 3 shaft, 4 collar, 5 cast iron
float mapM(vec3 p, out int m){

float map(vec3 p){ int m; return mapM(p,m); }
vec3 nrm(vec3 p){ vec2 e=vec2(.00035,0); return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx))); }

// one warm lamp, one low oxblood rim, a dim fill
uniform vec3 L0,L0u,L0v,E0,L1,L1u,L1v,E1;

uniform vec3 glowDir, glowC, glowW; vec3 bg(vec3 rd){ float g=pow(max(dot(rd,normalize(glowDir)),0.),26.); float w=pow(max(dot(rd,normalize(glowDir+vec3(0,.16,0))),0.),5.); return vec3(.0042,.003,.0034)+glowC*g+glowW*w; }

void surf(vec3 p, vec3 gn, int m, out vec3 alb, out float rough, out float metal, out vec3 n){

  if(m==0){ float s=fbm(p.xz*46.); float sp=step(.86,vn(p.xz*420.)); alb=mix(vec3(.02,.017,.018),vec3(.05,.043,.044),s)+sp*.01; rough=.2+.34*s; metal=0.; float dx=fbm(p.xz*190.)-.5, dz=fbm(p.zx*190.+3.)-.5; n=normalize(n+vec3(dx,0,dz)*.11); }
  else if(m==1){
    float r=q.y; float micro=fbm(vec2(ang*r*150.,q.x*150.)); float big=fbm(vec2(ang*6.,r*16.)+q.x*9.);
    float wr=smoothstep(.56,.76,big+.2*micro)*smoothstep(.05,.0,abs(fract(0.)+0.));
    float edge=smoothstep(.0,.004,.0);
    alb=vec3(.024,.021,.022)*(.8+.5*micro); rough=.3+.16*micro; metal=0.;
    float nearRim=smoothstep(.2195,.2245,r); float wear=smoothstep(.56,.68,fbm(vec2(ang*30.,q.x*150.)))*nearRim;
    alb=mix(alb,vec3(.085,.08,.08),wear); rough=mix(rough,.4,wear);
    float chalk=smoothstep(.58,.8,fbm(vec2(ang*2.3,r*11.)+vec2(q.x*4.,1.)))*.075*smoothstep(.45,.75,micro); alb+=chalk*vec3(.5,.48,.47);
    if((kind==0||kind==4)&&r<.0508){ alb=vec3(.8,.78,.76); metal=1.; rough=.13+.07*fbm(vec2(r*700.,ang*2.)); }
    float e=.0009; float a=fbm(vec2(ang*r*210.,q.x*210.)),b=fbm(vec2(ang*r*210.+3.,q.x*210.+3.)); n=normalize(n+(vec3(a,b,a*b*2.)-.5)*.035); if(r>.06&&r<.2) { float lathe=sin(r*1300.+vn(vec2(r*90.,ang))*3.); n=normalize(n+vec3(0.,normalize(vec2(p.y-AX,p.z))*lathe*.018)); }
  }
  else if(m==5){ float mi=fbm(p.xy*170.+p.z*91.); alb=vec3(.03,.027,.027)*(.75+.6*mi); rough=.32+.2*mi; metal=0.; float a=fbm(p.yz*240.),b=fbm(p.xz*240.+5.); n=normalize(n+(vec3(a,b,a*b*2.)-.5)*.05); }
  else if(m==2){ alb=vec3(.72,.70,.68); metal=1.; rough=.1+.07*fbm(vec2(q.x*520.,ang*4.)); float s=fbm(vec2(q.x*900.,ang*3.))-.5; n=normalize(n+vec3(s*.02,0,0)); }
  else if(m==3){ alb=vec3(.58,.56,.54); metal=1.; rough=.34; vec2 k=vec2(ang*.014+q.x,ang*.014-q.x)*760.; float kn=abs(sin(k.x))*abs(sin(k.y)); n=normalize(n+normalize(vec3(cos(k.x)*sign(sin(k.x)),0.,cos(k.y)*sign(sin(k.y))))*(.34*(1.-kn))); }

vec3 ggx(vec3 n, float a){ float u=rnd(),v=rnd(); float ct=sqrt((1.-u)/(1.+(a*a-1.)*u)), st=sqrt(1.-ct*ct), ph=6.2832*v; vec3 t=normalize(abs(n.y)<.9?cross(n,vec3(0,1,0)):cross(n,vec3(1,0,0))), b=cross(n,t); return normalize(t*st*cos(ph)+b*st*sin(ph)+n*ct); }
vec3 cosd(vec3 n){ float u=rnd(),v=rnd(); float r=sqrt(u), ph=6.2832*v; vec3 t=normalize(abs(n.y)<.9?cross(n,vec3(0,1,0)):cross(n,vec3(1,0,0))), b=cross(n,t); return normalize(t*r*cos(ph)+b*r*sin(ph)+n*sqrt(1.-u)); }
vec3 nee(vec3 p, vec3 n, vec3 c, vec3 u, vec3 v, vec3 E){ vec3 s=c+u*(rnd()-.5)+v*(rnd()-.5); vec3 w=s-p; float d=length(w); w/=d; float nl=dot(n,w); if(nl<=0.) return vec3(0); vec3 ln=normalize(cross(u,v)); float cl=abs(dot(ln,w)); if(march(p+n*.0012,w,d-.01)>0.) return vec3(0); return E*nl*cl*length(cross(u,v))/(d*d)/3.1416; }
vec3 trace(vec3 ro, vec3 rd){

    if(rnd()<ps){ vec3 h=ggx(n,max(rough*rough,.004)); vec3 nd=reflect(rd,h); if(dot(nd,gn)<=0.) break; rd=nd; T*=F/ps; lamps=true; }

void main(){
  rs=uint(gl_FragCoord.x)*1973u+uint(gl_FragCoord.y)*9277u+uint(seed)*26699u+1u;

}

<script id="post" type="x-shader">#version 300 es
precision highp float; out vec4 o; uniform sampler2D t; uniform vec2 res; uniform float n, exposure; uniform vec3 ground, grade;
float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }

void main(){ vec2 uv=gl_FragCoord.xy/res; vec3 c=texture(t,uv).rgb/n*exposure;
  vec3 b=vec3(0); for(int i=0;i<8;i++){ float a=float(i)*.785; b+=texture(t,uv+vec2(cos(a),sin(a)*res.x/res.y)*.006).rgb/n; } c+=max(b/8.-.6,vec3(0))*.1*exposure;
  float v=1.-.42*pow(length((uv-.5)*vec2(1.1,1.)),2.2)*2.; c*=v; c=aces(c); c=pow(c,vec3(1./2.2)); c=mix(c,c*c*(3.-2.*c),.6);
  float l=dot(c,vec3(.3,.6,.1)); c=mix(vec3(l)*grade,c,.82); vec3 g=ground*.72; c=g+c*(1.-g);
  c+=(h(gl_FragCoord.xy+.5)-.5)*.022; o=vec4(c,1.); }
</script>
<script>
const vs = `#version 300 es
void main(){ vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2); gl_Position=vec4(p*2.-1.,0,1); }`
const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' })

  const { w, h, spp } = S; cv.width = w; cv.height = h

  gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(gl.getUniformLocation(Q, 't'), 0); gl.uniform2f(gl.getUniformLocation(Q, 'res'), w, h); gl.uniform1f(gl.getUniformLocation(Q, 'n'), spp); gl.uniform1f(gl.getUniformLocation(Q, 'exposure'), S.exposure); gl.uniform3fv(gl.getUniformLocation(Q, 'ground'), S.ground); gl.uniform3fv(gl.getUniformLocation(Q, 'grade'), S.grade)
